name: Crear app Android (APK)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PulsoEconomico.apk
          gh release delete app --yes --cleanup-tag 2>/dev/null || true
          gh release create app PulsoEconomico.apk --title "Pulso Económico para Android" \
            --notes "Descarga PulsoEconomico.apk en tu celular y ábrelo para instalar."
