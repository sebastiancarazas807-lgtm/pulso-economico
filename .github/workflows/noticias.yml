name: Enviar noticias

on:
  schedule:
    # GitHub usa hora UTC. Lima = UTC-5.
    - cron: "0 13 * * *"   # 8:00 a. m. Lima
    - cron: "0 19 * * *"   # 2:00 p. m. Lima
    - cron: "0 0 * * *"    # 7:00 p. m. Lima
  workflow_dispatch: {}    # botón "Run workflow" para probar cuando quieras

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger noticias y enviar a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python noticias.py
      - name: Guardar en la página web
        run: |
          git config user.name "noticias-bot"
          git config user.email "noticias-bot@users.noreply.github.com"
          git add docs
          git commit -m "Noticias $(TZ=America/Lima date '+%d/%m/%Y %H:%M')" || echo "Sin cambios"
          git push
