plugins { id 'com.android.application' }

android {
    namespace 'pe.pulsoeconomico.app'
    compileSdk 34
    defaultConfig {
        applicationId 'pe.pulsoeconomico.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        debug { applicationIdSuffix '' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
